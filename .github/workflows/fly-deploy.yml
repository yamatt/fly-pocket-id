# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
      - "scripts/**"
      - "services/**"

permissions:
  contents: read

jobs:
  fly-config-validate:
    name: Validate Fly.io config
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Validate config
        run: flyctl config validate  --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker files with Hadolint
        uses: essentialkaos/hadolint-action@2ab1ea0c7dfc4674d5b4ee13eb8d6e64931652e8 # v1
        with:
          files: Dockerfile
          format: tty
          strict-labels: true
          failure-threshold: warning
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs:
      - fly-config-validate
      - dockerfile-lint
    concurrency: fly-deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Deploy latest
        run: flyctl deploy --remote-only --config fly.toml --app ${{
          secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
