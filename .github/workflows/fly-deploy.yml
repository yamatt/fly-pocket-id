# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
      - "scripts/**"
      - "services/**"
  workflow_run:
    workflows:
      - Auto-merge
    types:
      - completed

permissions:
  contents: read

jobs:
  fly-config-validate:
    name: Validate Fly.io config
    runs-on: ubuntu-slim
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Validate config
        run: flyctl config validate  --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker files with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs:
      - fly-config-validate
      - dockerfile-lint
    concurrency: fly-deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy latest
        run: flyctl deploy --remote-only --config fly.toml --app ${{
          secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
